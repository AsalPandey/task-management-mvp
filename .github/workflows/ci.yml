name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - phase-2-task-architecture
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: SQLite, quality, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create an ephemeral application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate and audit PHP dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: |
          find app bootstrap config database routes tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n scripts/hostinger-deploy.sh
          bash -n scripts/hostinger-cron.sh
          bash -n scripts/hostinger-package.sh
          bash tests/hostinger-package-test.sh
          bash tests/hostinger-package-content-test.sh

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Install locked development-only static analyzer
        run: composer install --working-dir=tools/static-analysis --no-interaction --prefer-dist --no-progress

      - name: Reject new static-analysis diagnostics
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          composer validate --working-dir=tools/static-analysis --strict
          composer audit --working-dir=tools/static-analysis --locked --no-interaction
          composer analyse

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate

      - name: Build production assets
        run: |
          npm run check:js
          npm run build

      - name: Preserve the exact production asset build
        uses: actions/upload-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 7

      - name: Run maintained SQLite suite
        run: php artisan test

      - name: Compile Blade templates
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: Reject tracked secrets and generated source changes
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "A real .env file must not be tracked."
            exit 1
          fi

          if git ls-files | grep -E '\.(pem|p12|pfx|sqlite|sqlite3|db|dump)$' >/dev/null; then
            echo "A private-key or database artifact is tracked."
            exit 1
          fi

          git diff --check
          git diff --exit-code

  mariadb:
    name: MariaDB migrations and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: task_management_phase28_ci_main
      DB_USERNAME: root
      DB_PASSWORD: ci_root_password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      INITIAL_COMPANY_NAME: R3C CI Company
      INITIAL_MANAGER_NAME: R3C CI Manager
      INITIAL_MANAGER_EMAIL: manager@r3c-ci.example.invalid
      INITIAL_MANAGER_PASSWORD: A-unique-CI-bootstrap-secret-123!

    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: task_management_phase28_ci_main
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Create an ephemeral application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run disposable MariaDB qualification
        run: bash scripts/ci-mariadb-tests.sh

  browser:
    name: Clean-company browser critical path
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8046
      R44_SUBPATH_URL: http://127.0.0.1:8047/qualification/task-management
      APP_TIMEZONE: Asia/Kathmandu
      APP_SETUP_TOKEN: r41-disposable-installer-token
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: task_management_r41_browser_ci
      DB_USERNAME: root
      DB_PASSWORD: ci_root_password
      SESSION_DRIVER: database
      # The disposable browser servers use loopback HTTP, including APIRequestContext.
      # Real HTTPS deployments retain secure cookies from their production environment.
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: task_management_r41_browser_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: public/build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare empty production-like company
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php scripts/r41-browser-prepare.php
      - name: Exercise the real rendered critical path
        run: |
          (cd public && php -d memory_limit=128M -S 127.0.0.1:8046 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php) > /tmp/r41-browser-server.log 2>&1 &
          php -d memory_limit=128M -S 127.0.0.1:8047 tests/Support/r44_subdirectory_router.php > /tmp/r44-subpath-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8046/up && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8046/up
          npm run test:browser
          php artisan optimize:clear
          php artisan optimize
          npx playwright test --grep 'logout and login retain'
      - name: Exercise bounded large-data browser pages
        run: |
          php artisan config:clear
          export DB_DATABASE=task_management_r43_browser_ci
          MYSQL_PWD="$DB_PASSWORD" mysql --protocol=tcp --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" --execute="CREATE DATABASE task_management_r43_browser_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php artisan migrate --seed --force --no-interaction
          php scripts/r43-prepare-performance.php 10000 20 10000 > /tmp/r43-browser-oracle.json
          php artisan optimize
          R43_LARGE_BROWSER=1 npx playwright test tests/Browser/r43-performance.spec.js
      - name: Exercise dense 1000-person roster browser workflow
        run: |
          php artisan config:clear
          export DB_DATABASE=task_management_r6_company
          MYSQL_PWD="$DB_PASSWORD" mysql --protocol=tcp --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" --execute="CREATE DATABASE task_management_r6_company CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php scripts/r61-prepare-roster.php 1000 > /tmp/r61-roster-oracle.json
          php artisan optimize
          R61_LARGE_ROSTER=1 npx playwright test tests/Browser/z-r61-roster.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ github.sha }}
          path: |
            output/playwright
            output/r44
          retention-days: 7

  deploy:
    name: Hostinger atomic release
    needs: [quality, mariadb, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: hostinger-task-management
      cancel-in-progress: false
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4

      - name: Set up production PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none

      - name: Assemble only tracked source and locked production dependencies
        run: |
          mkdir release
          git archive "$GITHUB_SHA" | tar -x -C release
          cd release
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          test ! -f .env
          printf '%s\n' "$GITHUB_SHA" > .release-sha

      - name: Restore assets built by the successful quality job
        uses: actions/download-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: release/public/build

      - name: Package the immutable release
        run: |
          test -f release/public/build/manifest.json
          bash scripts/hostinger-package.sh release "$RUNNER_TEMP/task-release.tar.gz"

      - name: Deploy through the dedicated restricted SSH key
        env:
          TASK_DEPLOY_KEY: ${{ secrets.HOSTINGER_DEPLOY_KEY }}
          TASK_DEPLOY_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          TASK_DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          TASK_DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          TASK_DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/task-ssh"
          printf '%s\n' "$TASK_DEPLOY_KEY" > "$RUNNER_TEMP/task-ssh/key"
          printf '%s\n' "$TASK_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/task-ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/task-ssh/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/task-ssh/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$TASK_DEPLOY_PORT" "$TASK_DEPLOY_USER@$TASK_DEPLOY_HOST" \
            "deploy $GITHUB_SHA" < "$RUNNER_TEMP/task-release.tar.gz"
